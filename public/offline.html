<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sedang Offline — Jagoan Fisika</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f5f7fc;
        color: #13203b;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 420px;
        background: #ffffff;
        border: 1px solid #dce4f4;
        border-radius: 24px;
        padding: 32px 24px;
      }
      h1 { font-size: 1.5rem; margin: 16px 0 8px; }
      p { line-height: 1.6; color: #475569; margin: 0 0 20px; }
      button {
        background: #ff7a1a;
        color: #fff;
        border: 0;
        border-radius: 14px;
        padding: 12px 24px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div style="font-size: 48px;" aria-hidden="true">⚡</div>
      <h1>Kamu Sedang Offline</h1>
      <p>Koneksi internet terputus. Video YouTube butuh internet, tetapi rumus, catatan, dan latihan soal tetap bisa kamu buka di dalam aplikasi.</p>
      <button onclick="window.location.href='/'">Kembali ke Jagoan Fisika</button>
    </main>
  </body>
</html>
